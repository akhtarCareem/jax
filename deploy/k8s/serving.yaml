apiVersion: serving.yoda/v1
kind: Serving
metadata:
  name: jax-server
  namespace: <your-yoda-project-namespace>
spec:
  minReplicas: 1
  maxReplicas: 3
  nodeSelector:
    # Adjust to match the GPU node pool label in your cluster.
    # Ask the platform team for the correct key/value.
    node.kubernetes.io/instance-type: gpu
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  container:
    name: main
    image: 848569320300.dkr.ecr.eu-west-1.amazonaws.com/boba/jax-test:latest
    ports:
      - containerPort: 8080
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: "1"
    env:
      - name: JAX_SERVER_CONFIG
        value: /app/configs/gpu-example.yaml
      - name: HF_HUB_DISABLE_PROGRESS_BARS
        value: "1"
      - name: HF_HOME
        value: /cache/hf
      - name: JAX_COMPILATION_CACHE_DIR
        value: /cache/jax
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: jax-server-secrets
            key: HF_TOKEN
      # Optional: uncomment to require Bearer auth on /v1/models/..:predict
      # - name: JAX_SERVER_AUTH_TOKEN
      #   valueFrom:
      #     secretKeyRef:
      #       name: jax-server-secrets
      #       key: JAX_SERVER_AUTH_TOKEN
    volumeMounts:
      - name: cache
        mountPath: /cache
    # HF download + first JAX XLA compile can take several minutes on a cold start.
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12
  podAnnotations:
    prometheus.io/port: "8080"
  # Inline volume — re-downloads HF artifacts on every pod restart.
  # Replace with a PVC for large models or to avoid repeated downloads.
  # volumes field goes on the pod spec; r2-d2 passes it through podAnnotations/podLabels only.
  # Add the volume via a PVC or by patching the Deployment after creation if needed.
