[project]
name = "jax-server"
version = "0.1.0"
description = "JAX model serving runtime for exported artifacts backed by Hugging Face storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "huggingface_hub>=0.30.0",
  "numpy>=1.26.0",
  "orjson>=3.10.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
jax = [
  "dm-haiku>=0.0.13",
  "flatbuffers>=25.0.0",
  "flax>=0.10.0",
  "jax>=0.4.30",
  "orbax-checkpoint>=0.11.0",
  "msgpack>=1.1.0",
]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]
modal = [
  "modal>=1.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
